<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>База данных бота</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <p class="eyebrow">Панель администратора</p>
          <h1>База данных бота</h1>
          <p class="subtitle">Просмотр данных из защищенной базы Supabase.</p>
        </div>
        <button id="sign-out" class="secondary-button" type="button" hidden>Выйти</button>
      </header>

      <section id="login-panel" class="panel login-panel">
        <h2>Вход</h2>
        <p>Войдите с учетной записью, которой администратор разрешил доступ к панели.</p>
        <form id="login-form">
          <label class="control">
            <span>Email</span>
            <input id="email" type="email" autocomplete="username" required>
          </label>
          <label class="control">
            <span>Пароль</span>
            <input id="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" type="submit">Войти</button>
        </form>
      </section>

      <section id="dashboard" hidden>
        <section class="toolbar" aria-label="Управление таблицей">
          <label class="control">
            <span>Таблица</span>
            <select id="table-select"></select>
          </label>
          <form id="search-form" class="search-control">
            <label class="control" for="search-input">
              <span>Поиск по таблице</span>
              <input id="search-input" type="search" maxlength="100" placeholder="Введите текст...">
            </label>
            <button class="secondary-button" type="submit">Найти</button>
          </form>
        </section>

        <section class="table-card" aria-label="Содержимое базы данных">
          <div class="table-heading">
            <p id="table-label"></p>
            <p id="result-count"></p>
          </div>
          <div id="status" class="status" role="status" aria-live="polite" hidden></div>
          <div class="table-scroll">
            <table>
              <thead id="table-head"></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <nav class="pagination" aria-label="Страницы таблицы">
            <button id="previous-page" class="secondary-button" type="button">← Назад</button>
            <span id="page-indicator"></span>
            <button id="next-page" class="secondary-button" type="button">Далее →</button>
          </nav>
        </section>
      </section>

      <p id="app-status" class="app-status" role="status" aria-live="polite"></p>
      <footer>Доступ предоставляется через Supabase Auth и политики RLS.</footer>
    </main>
  </body>
</html>
